<div class="min-h-screen flex flex-col bg-slate-50">
  <!-- Navigation Header -->
  <nav class="bg-blue-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <!-- Logo / Brand -->
        <div class="flex items-center gap-3">
          <a routerLink="/" class="flex items-center gap-2 text-xl font-bold text-white hover:text-blue-200 transition-colors">
            <span class="text-2xl">⏰</span>
            <span>Pointage</span>
          </a>
        </div>
        
        <!-- Desktop Navigation -->
        <div class="hidden lg:flex items-center gap-1">
          @for (item of navItems; track item.path) {
            <a 
              [routerLink]="item.path" 
              routerLinkActive="bg-blue-700 text-white"
              [routerLinkActiveOptions]="{exact: item.path === '/'}"
              class="flex items-center gap-2 px-3 py-2 rounded-lg text-blue-200 hover:bg-blue-800 hover:text-white transition-all text-sm font-medium">
              <span>{{ item.icon }}</span>
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
        
        <!-- Mobile Menu Button -->
        <button 
          type="button" 
          (click)="toggleMobileMenu()"
          class="lg:hidden p-2 rounded-lg text-blue-200 hover:bg-blue-800 hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!mobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path *ngIf="mobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Mobile Navigation -->
    <div *ngIf="mobileMenuOpen()" class="lg:hidden bg-blue-800 border-t border-blue-700">
      <div class="px-4 py-3 space-y-1">
        @for (item of navItems; track item.path) {
          <a 
            [routerLink]="item.path" 
            routerLinkActive="bg-blue-700 text-white"
            [routerLinkActiveOptions]="{exact: item.path === '/'}"
            (click)="mobileMenuOpen.set(false)"
            class="flex items-center gap-3 px-4 py-3 rounded-lg text-blue-200 hover:bg-blue-700 hover:text-white transition-all text-sm font-medium">
            <span class="text-lg">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    </div>
  </nav>
  
  <!-- Main Content -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>
  
  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-slate-500">
        <div class="flex items-center gap-2">
          <span>⏰</span>
          <span>Pointage - Système de Gestion du Temps</span>
        </div>
        <div class="flex items-center gap-4">
          <span>Backend: .NET 10</span>
          <span>•</span>
          <span>Frontend: Angular 21</span>
          <span>•</span>
          <span>Device: ZKTeco MB2000</span>
        </div>
      </div>
    </div>
  </footer>
</div>
