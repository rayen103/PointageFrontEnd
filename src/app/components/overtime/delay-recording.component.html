<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
<div class="delay-container">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200">
          <div class="text-xl font-semibold text-slate-900">
            <h2>Enregistrement des Retards</h2>
          </h2>
        </div>

        <div class="p-6">
          <div class="recording-form">
            <div class="form-row">
              <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-2">Matricule</label>
                <input class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" [(ngModel)]="matricule" placeholder="Ex: EMP001">
              </div>

              <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-2">Date</label>
                <input class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" type="date" [(ngModel)]="selectedDate">
                
                
              </div>

              <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-2">Retard (minutes)</label>
                <input class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" type="number" [(ngModel)]="retardMn" min="0">
              </div>

              <button class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors shadow-sm" 
                      (click)="recordDelay()" 
                      [disabled]="loading()">
                @if (loading()) {
                  <div class="flex justify-center py-8"><div class="animate-spin rounded-full h-12 w-12 border-4 border-primary-200 border-t-primary-600"></div></div>
                } @else {
                  <span class="button-content"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg> Enregistrer</span>
                }
              </button>
            </div>
          </div>

          <div class="delays-list">
            <h3>Retards du Mois</h3>
            @if (loadingList()) {
              <div class="loading">
                <div class="flex justify-center py-8"><div class="animate-spin rounded-full h-12 w-12 border-4 border-primary-200 border-t-primary-600"></div></div>
              </div>
            } @else {
              <table class="min-w-full divide-y divide-slate-200"  >
                
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider" >Matricule</th>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900" >{{ delay.matricule }}</td>
                

                
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider" >Date</th>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900" >{{ formatDate(delay.dateRetard) }}</td>
                

                
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider" >Durée</th>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900" >{{ delay.retardMn }} min</td>
                

                
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider" >Retard Réel</th>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900" >{{ delay.retardReel }} min</td>
                

                <tr class="bg-slate-50" ></tr>
                <tr class="hover:bg-slate-50 transition-colors" ></tr>
              </table>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
