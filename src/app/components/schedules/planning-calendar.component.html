<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
<div class="planning-container">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200">
          <div class="text-xl font-semibold text-slate-900">
            <h2>Planning Calendrier</h2>
          </div>
          <div class="header-actions">
            <div class="mb-4">
              <label class="block text-sm font-medium text-slate-700 mb-2">Matricule</label>
              <input class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" [(ngModel)]="selectedMatricule" (change)="loadPlanning()">
            </div>
            <button class="p-2 rounded-lg hover:bg-slate-100 transition-colors" (click)="previousMonth()">
              <span class="text-lg">chevron_left</span>
            </button>
            <span class="month-label">{{ getMonthName() }}</span>
            <button class="p-2 rounded-lg hover:bg-slate-100 transition-colors" (click)="nextMonth()">
              <span class="text-lg">chevron_right</span>
            </button>
          </div>
        </div>

        <div class="p-6">
          @if (loading()) {
            <div class="loading">
              <div class="flex justify-center py-8"><div class="animate-spin rounded-full h-12 w-12 border-4 border-primary-200 border-t-primary-600"></div></div>
            </div>
          } @else {
            <div class="calendar-grid">
              <div class="weekdays">
                @for (day of weekDays; track day) {
                  <div class="weekday">{{ day }}</div>
                }
              </div>
              <div class="days">
                @for (day of calendarDays(); track day.date) {
                  <div class="day-cell"
                       [class.weekend]="day.isWeekend"
                       [class.today]="day.isToday"
                       [class.has-planning]="day.planning">
                    <div class="day-number">{{ day.date.getDate() }}</div>
                    @if (day.planning) {
                      <div class="planning-info">
                        <div class="shift-code">{{ day.planning.codeShift || '-' }}</div>
                        <div class="horaire-code">{{ day.planning.codeHoraire || '-' }}</div>
                      </div>
                    }
                  </div>
                }
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
