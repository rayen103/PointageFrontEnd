<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
<h2 mat-dialog-title>Membres de l'équipe: {{ data.team.desigEq }}</h2>

    <mat-dialog-content>
      @if (loading()) {
        <div class="loading">
          <div class="flex justify-center py-8"><div class="animate-spin rounded-full h-12 w-12 border-4 border-primary-200 border-t-primary-600"></div></div>
        </div>
      } @else {
        <div class="add-member-section">
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-2">Matricule</label>
            <input class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" [(ngModel)]="newMatricule" placeholder="EMP001">
          </div>
          <button class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors shadow-sm" (click)="addMember()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            Ajouter
          </button>
        </div>

        <div class="members-table">
          <table class="min-w-full divide-y divide-slate-200">
            <thead>
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Matricule</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              @for (member of members(); track member.matricule) {
                <tr class="hover:bg-slate-50 transition-colors">
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900">{{ member.matricule }}</td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900">
                    <button class="p-2 rounded-lg hover:bg-slate-100 transition-colors" color="warn" [matTooltip]="'Retirer'" (click)="removeMember(member)">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button class="inline-flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-slate-100 transition-colors" (click)="onClose()">Fermer</button>
    </mat-dialog-actions>
  </div>
</div>
