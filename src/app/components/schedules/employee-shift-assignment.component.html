<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
<div class="assignment-container">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200">
          <div class="text-xl font-semibold text-slate-900">
            <h2>Affectation des Shifts aux Employés</h2>
          </div>
        </div>

        <div class="p-6">
          <div class="assignment-form">
            <div class="mb-4">
              <label class="block text-sm font-medium text-slate-700 mb-2">Matricule</label>
              <input class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" [(ngModel)]="matricule" placeholder="Ex: EMP001">
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-slate-700 mb-2">Shift</label>
              <select class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors bg-white" [(ngModel)]="selectedShift">
                @for (shift of shifts(); track shift.codeShift) {
                  <option [value]="shift.codeShift">
                    {{ shift.codeShift }} - {{ shift.designationShift }}
                  </option>
                }
              </select>
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-slate-700 mb-2">Date Début</label>
              <input class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" type="date" [(ngModel)]="dateDebut">


            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-slate-700 mb-2">Date Fin</label>
              <input class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors" type="date" [(ngModel)]="dateFin">


            </div>

            <button class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors shadow-sm" (click)="assignShift()" [disabled]="loading()">
              @if (loading()) {
                <div class="flex justify-center py-8"><div class="animate-spin rounded-full h-12 w-12 border-4 border-primary-200 border-t-primary-600"></div></div>
              } @else {
                <span class="button-content"><span class="text-lg">assignment</span> Affecter</span>
              }
            </button>
          </div>

          @if (success()) {
            <div class="success-message">
              <span class="text-lg">check_circle</span>
              <span>Shift affecté avec succès!</span>
            </div>
          }

          @if (error()) {
            <div class="error-message">
              <span class="text-lg">error</span>
              <span>{{ error() }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
